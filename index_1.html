<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Мой планер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg2: var(--tg-theme-secondary-bg-color, #f2f1f6);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #19181f);
  --hint: var(--tg-theme-hint-color, #8b8995);
  --acc: var(--tg-theme-button-color, #6b5ce7);
  --acc-t: var(--tg-theme-button-text-color, #ffffff);
  --sep: color-mix(in srgb, var(--hint) 22%, transparent);
  --soft: color-mix(in srgb, var(--acc) 13%, transparent);
  --field: color-mix(in srgb, var(--hint) 11%, transparent);
  --ok: #2fa56a; --bad: #e0544b; --warn: #e3a03a;
  --c1: var(--acc); --c2: #e3a03a; --c3: #2fa58f; --c4: #e0544b; --c5: #4a8fe7;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not(.tg){ --bg2:#111114; --card:#1d1c22; --text:#ececf1; --hint:#8d8b97; --acc:#8a7cf0; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg2);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
#view{max-width:640px;margin:0 auto;padding:6px 0 10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 4px}
.head h1{font-size:22px;margin:0;letter-spacing:-.01em}
.dnav{display:flex;align-items:center;gap:6px;padding:6px 12px 2px}
.dnav .mid{flex:1;text-align:center}
.dnav .mid b{display:block;font-size:18px;letter-spacing:-.01em}
.dnav .mid small{color:var(--hint);font-size:13px}
.nb{width:38px;height:38px;border-radius:12px;border:0;background:var(--card);font-size:20px;line-height:1;display:grid;place-items:center}
.link{background:none;border:0;color:var(--acc);font-size:13px;padding:2px 6px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 12px}
.card h3{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--hint);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 span{letter-spacing:0;text-transform:none;font-size:13px;color:var(--text);font-weight:600}
.hint{color:var(--hint);font-size:13px;margin:4px 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--sep)}
.row:first-of-type,.card h3+.row{border-top:0}
.row .grow{flex:1;min-width:0}
.row small,.sub{color:var(--hint);font-size:12.5px}
.tap{cursor:pointer}
.chk{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid color-mix(in srgb,var(--hint) 45%,transparent);background:transparent;padding:0;position:relative;transition:.15s}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk.on::after{content:"";position:absolute;left:7px;top:3px;width:7px;height:12px;border:solid var(--acc-t);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.in{width:100%;background:var(--field);border:0;border-radius:11px;padding:10px 12px;outline:none;min-width:0}
.in:focus{box-shadow:0 0 0 2px var(--soft)}
.in.plain{background:transparent;padding:4px 2px;border-radius:6px}
.in.plain:focus{background:var(--field);box-shadow:none}
.in.done{color:var(--hint);text-decoration:line-through}
textarea.in{resize:vertical;min-height:62px}
.x{flex:none;border:0;background:none;color:var(--hint);font-size:15px;padding:6px;opacity:.7}
.add{display:flex;gap:8px;margin-top:8px}
.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:600;background:var(--acc);color:var(--acc-t)}
.btn.sm{padding:8px 14px;font-size:18px;line-height:1}
.btn.ghost{background:var(--soft);color:var(--acc)}
.btn.wide{width:100%;margin-top:10px}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:0;border-radius:20px;padding:8px 12px;background:var(--field);font-size:14px;transition:.15s}
.pill.on{background:var(--acc);color:var(--acc-t)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--field);border-radius:13px;padding:10px 11px;min-width:0}
.kpi b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.kpi span{font-size:12px;color:var(--hint)}
.kpi.big{grid-column:1/-1}
.kpi.big b{font-size:24px}
.bar{height:6px;background:var(--field);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar.over i{background:var(--bad)}
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;gap:2px;margin:8px 12px 2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:10px;padding:7px 10px;font-size:13.5px;color:var(--hint);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.scale{display:flex;gap:4px;margin-top:6px}
.scale button{flex:1;height:32px;border-radius:9px;border:0;background:var(--field);font-size:13px;padding:0}
.scale button.on{background:var(--acc);color:var(--acc-t);font-weight:600}
.pf{padding:9px 0;border-top:1px solid var(--sep)}
.pf:first-of-type{border-top:0}
.pf label{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
.pf .num{width:96px;text-align:center}
.amt{font-weight:600;white-space:nowrap}
.amt.inc{color:var(--ok)}
.amt.sav{color:var(--acc)}
.chart{width:100%;display:block;margin-top:6px;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--hint);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.gridwrap{overflow-x:auto;margin:0 -14px;padding:0 14px;scrollbar-width:thin}
table.hg{border-collapse:separate;border-spacing:3px;font-size:11px}
table.hg th{font-weight:500;color:var(--hint);text-align:center;min-width:24px}
table.hg th.t,table.hg td.t{color:var(--acc);font-weight:700}
table.hg td.nm{position:sticky;left:0;z-index:1;background:var(--card);min-width:118px;max-width:140px;padding-right:6px;font-size:12.5px;line-height:1.2}
table.hg td.nm small{display:block;color:var(--hint);font-size:11px}
table.hg th.nm{position:sticky;left:0;background:var(--card);z-index:1;min-width:118px}
.cell{display:block;width:24px;height:24px;border-radius:7px;border:0;background:var(--field);padding:0}
.cell.on{background:var(--acc)}
.cell.t{box-shadow:inset 0 0 0 2px var(--acc)}
.cell.on.t{box-shadow:none}
td.sum{white-space:nowrap;padding-left:6px;font-weight:600;font-size:12px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th{font-weight:500;color:var(--hint);font-size:12px;text-align:right;padding:6px 4px}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{padding:7px 4px;border-top:1px solid var(--sep);text-align:right;white-space:nowrap}
table.tb tr.tot td{font-weight:700}
table.tb tr.tap:active{background:var(--field)}
table.tb .in{padding:6px 8px;text-align:right;width:92px;border-radius:8px}
.scroll{overflow-x:auto;margin:0 -14px;padding:0 14px}
.dayhd{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 2px}
.dayhd:first-child{margin-top:0}
.ico{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--field);font-size:15px}
.item{background:var(--field);border-radius:13px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item .fl:first-child{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--hint);min-width:0}
.item:not(.form) .fl .in{background:var(--card)}
.fl.inline{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:13.5px}
.fl.full{grid-column:1/-1}
.iact{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.iact button{border:0;background:var(--card);border-radius:9px;padding:6px 11px;font-size:13px}
.iact .del{color:var(--bad)}
.days{display:flex;gap:4px}
.days button{flex:1;border:0;border-radius:8px;padding:7px 0;background:var(--card);font-size:12px}
.days button.on{background:var(--acc);color:var(--acc-t)}
.sec{display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin:0;font-size:16px;font-weight:600}
.sec small{color:var(--hint);font-weight:400;font-size:13px}
.sec .ch{color:var(--hint);transition:.2s}
.sec.open .ch{transform:rotate(90deg)}
.secbody{margin-top:12px}
.dot{display:inline-block;width:14px;height:14px;border-radius:5px;background:var(--field)}
.dot.on{background:var(--acc)}
.empty{text-align:center;color:var(--hint);padding:18px 10px;font-size:14px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--acc);font-size:12px;font-weight:700;padding:0 5px}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;border:0;background:var(--acc);color:var(--acc-t);font-size:22px;font-weight:700;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 40%,transparent);z-index:5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--sep);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;border:0;background:none;color:var(--hint);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
.sheet h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet .seg{margin:0 0 12px}
.sheet .amtin{font-size:30px;font-weight:700;text-align:center;padding:12px;background:var(--field)}
.sheet .pills{max-height:190px;overflow:auto;margin:10px 0}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,20,24,.92);color:#fff;padding:9px 14px;border-radius:12px;font-size:13.5px;z-index:50;max-width:88vw;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1}
.loading{padding:60px 0;text-align:center;color:var(--hint)}
.msg{padding:40px 24px;text-align:center}
.msg b{display:block;font-size:18px;margin-bottom:8px}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.note{font-size:13px;color:var(--hint);background:var(--field);border-radius:12px;padding:10px 12px;margin-top:10px}
.big-num{font-size:26px;font-weight:700;letter-spacing:-.02em}
.flexb{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
</style>
</head>
<body>
<main id="view"><div class="loading">Загрузка…</div></main>
<button class="fab" id="fab" data-a="txNew" hidden>₽</button>
<nav class="tabs" id="tabs" hidden>
  <button data-a="tab" data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сегодня</button>
  <button data-a="tab" data-t="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 14h2M11 14h2M14.5 14h2"/></svg>Неделя</button>
  <button data-a="tab" data-t="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="m14.5 17.5 2 2 4-4"/></svg>Привычки</button>
  <button data-a="tab" data-t="fin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="5.5" width="19" height="14" rx="3"/><path d="M2.5 10h19M16 15h2"/></svg>Финансы</button>
  <button data-a="tab" data-t="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Настройки</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>

const pad = (n) => String(n).padStart(2, '0');

// ================== хранилище: Telegram CloudStorage ==================
// Данные лежат в облаке Telegram у каждого пользователя отдельно.
// Лимиты Telegram: до 1024 ключей, до 4096 символов в значении → режем на куски.
const KV = (() => {
  const CS = CLOUD && tg.CloudStorage;
  if (CS) {
    const p = (fn) => new Promise((res, rej) => {
      try { fn((e, v) => (e ? rej(new Error('Хранилище Telegram: ' + e)) : res(v))); } catch (e) { rej(e); }
    });
    return {
      async get(keys) {
        const out = {};
        for (let i = 0; i < keys.length; i += 50) Object.assign(out, await p((cb) => CS.getItems(keys.slice(i, i + 50), cb)));
        return out;
      },
      set: (k, v) => p((cb) => CS.setItem(k, v, cb)),
      del: (keys) => (keys.length ? p((cb) => CS.removeItems(keys, cb)) : Promise.resolve()),
      keys: () => p((cb) => CS.getKeys(cb)),
    };
  }
  const mem = {}; // демо в обычном браузере — ничего не сохраняется
  return {
    async get(keys) { const o = {}; for (const k of keys) o[k] = mem[k] ?? ''; return o; },
    async set(k, v) { if (v.length > 4096) throw new Error('value too long'); mem[k] = v; },
    async del(keys) { for (const k of keys) delete mem[k]; },
    async keys() { return Object.keys(mem); },
  };
})();

const CHUNK = 3900;
const heads = {}; // заголовок ключа: буква поколения + число кусков, например "a3"
async function readMany(keys) {
  const hs = await KV.get(keys);
  const need = [], plan = {};
  for (const k of keys) {
    const h = hs[k] || '';
    heads[k] = h;
    if (!/^[ab]\d+$/.test(h)) { plan[k] = null; continue; }
    plan[k] = { g: h[0], n: Number(h.slice(1)) };
    for (let i = 0; i < plan[k].n; i++) need.push(`${k}_${h[0]}${i}`);
  }
  const parts = need.length ? await KV.get(need) : {};
  const out = {};
  for (const k of keys) {
    const pl = plan[k];
    if (!pl) { out[k] = null; continue; }
    let s = '';
    for (let i = 0; i < pl.n; i++) s += parts[`${k}_${pl.g}${i}`] || '';

// Запись «новым поколением»: сначала куски, потом заголовок, потом удаляем старые куски.

async function writeL(k, obj) {
  const s = JSON.stringify(obj);
  const old = heads[k] !== undefined ? heads[k] : (await KV.get([k]))[k] || '';
  const g = old[0] === 'a' ? 'b' : 'a';
  const n = Math.max(1, Math.ceil(s.length / CHUNK));
  for (let i = 0; i < n; i++) await KV.set(`${k}_${g}${i}`, s.slice(i * CHUNK, (i + 1) * CHUNK));
  await KV.set(k, g + n);
  heads[k] = g + n;
  if (/^[ab]\d+$/.test(old)) await KV.del(Array.from({ length: Number(old.slice(1)) }, (_, i) => `${k}_${old[0]}${i}`));
}

// Данные разложены по месяцам: m202610 = { d: {дни}, t: [записи], w: {недели}, g: цели месяца }
const BK = {};
const bk = (date) => 'm' + date.slice(0, 7).replace('-', '');
const emptyB = () => ({ d: {}, t: [], w: {}, g: null });
async function buckets(keys) {
  const miss = keys.filter((k) => !(k in BK));
  if (miss.length) { const r = await readMany(miss); for (const k of miss) BK[k] = r[k] || emptyB(); }
  return keys.map((k) => BK[k]);
}
const bucket = async (k) => (await buckets([k]))[0];
const saveB = (k) => writeQ(k, BK[k]);
async function allBucketKeys() { return (await KV.keys()).filter((k) => /^m\d{6}$/.test(k)).sort(); }
function monthsRange(from, to) {
  const out = []; let m = from.slice(0, 7); const end = to.slice(0, 7);
  while (m <= end && out.length < 600) { out.push(m); m = addM(m, 1); }
  return out;
}
let idc = 0;
const newId = (date) => `${bk(date).slice(1)}_${Date.now().toString(36)}${(idc++ % 1296).toString(36).padStart(2, '0')}`;
const cleanTx = (b) => ({ date: b.date, type: b.type, category: String(b.category || 'Прочее').slice(0, 80), amount: Math.round(num(b.amount) * 100) / 100, comment: String(b.comment || '').slice(0, 300) });
const cl = (x) => (x == null ? x : structuredClone(x));

async function api(method, path, body) {
  const u = new URL(path, 'http://x/');
  const p = u.pathname.split('/').filter(Boolean);
  const q = (k) => u.searchParams.get(k);
  switch (p[0]) {
    case 'me': {
      const r = await readMany(['s']);
      const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
      return { name: [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Демо', settings: r.s };
    }
    case 'settings':
      await writeQ('s', cl(body));
      return { ok: true };
    case 'doc': {
      const [, kind, key] = p;
      const k = kind === 'month' ? 'm' + key.replace('-', '') : bk(key);
      const b = await bucket(k);
      if (method === 'GET') return cl(kind === 'day' ? b.d[key.slice(8)] : kind === 'week' ? b.w[key] : b.g) ?? null;
      if (kind === 'day') b.d[key.slice(8)] = cl(body); else if (kind === 'week') b.w[key] = cl(body); else b.g = cl(body);
      await saveB(k);
      return { ok: true };
    }
    case 'docs': {
      const from = q('from'), to = q('to'), ms = monthsRange(from, to);
      const bs = await buckets(ms.map((m) => 'm' + m.replace('-', '')));
      const out = {};
      bs.forEach((b, i) => { for (const dd in b.d) { const key = ms[i] + '-' + dd; if (key >= from && key <= to) out[key] = cl(b.d[dd]); } });
      return out;
    }
    case 'tx-rename': {
      const ks = await allBucketKeys();
      const bs = await buckets(ks);
      for (let i = 0; i < ks.length; i++) {
        let ch = false;
        for (const t of bs[i].t) if (t.type === body.type && t.category === body.from) { t.category = body.to; ch = true; }
        if (ch) await saveB(ks[i]);
      }
      return { ok: true };
    }
    case 'tx': {
      const id = p[1] || '';
      if (method === 'GET') {
        const from = q('from'), to = q('to');
        const ks = from ? monthsRange(from, to).map((m) => 'm' + m.replace('-', '')) : await allBucketKeys();
        const bs = await buckets(ks);
        return bs.flatMap((b) => b.t).filter((t) => (!from || (t.date >= from && t.date <= to)))
          .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.id < b.id ? 1 : -1)).map((t) => ({ ...t }));
      }
      if (method === 'POST') {
        const t = { ...cleanTx(body), id: newId(body.date) };
        const k = bk(t.date);
        (await bucket(k)).t.push(t);
        await saveB(k);
        return { id: t.id };
      }
      const ok = 'm' + id.split('_')[0];
      const ob = await bucket(ok);
      const i = ob.t.findIndex((t) => t.id === id);
      if (method === 'DELETE') { if (i >= 0) { ob.t.splice(i, 1); await saveB(ok); } return { ok: true }; }
      if (method === 'PUT') {
        const t = cleanTx(body);
        if (i >= 0) ob.t.splice(i, 1);
        const nk = bk(t.date);
        const nt = { ...t, id: nk === ok ? id : newId(t.date) };
        (await bucket(nk)).t.push(nt);
        if (nk !== ok) await saveB(ok);
        await saveB(nk);
        return { ok: true };
      }
    }
  }
  throw new Error('Неизвестный запрос: ' + path);
}

async function importSeed(data) {
  for (const d of data.docs || []) {
    if (d.kind === 'week') (await bucket(bk(d.key))).w[d.key] = cl(d.data);
    else if (d.kind === 'month') (await bucket('m' + d.key.replace('-', ''))).g = cl(d.data);
    else if (d.kind === 'day') (await bucket(bk(d.key))).d[d.key.slice(8)] = cl(d.data);
  }
  for (const t of data.tx || []) (await bucket(bk(t.date))).t.push({ ...cleanTx(t), id: newId(t.date) });
  for (const k of Object.keys(BK)) await saveB(k);
  await writeQ('s', cl(data.settings));
}

const normCode = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
async function decryptSeed(code) {
  if (!ENC_SEED) throw new Error('В этой сборке нет данных для переноса');
  const raw = Uint8Array.from(atob(ENC_SEED), (c) => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normCode(code)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  try {
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct)));
  } catch (e) { throw new Error('Неверный код'); }
}

// отложенное сохранение
const pend = {};
function later(key, fn, ms = 600) {
  if (pend[key]) clearTimeout(pend[key].t);
  pend[key] = { fn, t: setTimeout(() => run(key), ms) };
}
function run(key) {
  const p = pend[key];

  clearTimeout(p.t);
  return p.fn().catch((e) => toast('Не сохранилось: ' + e.message));
}

  for (const x of list) {
    if (withDates && x.date !== last) { h += `<div class="dayhd">${dLong(x.date)}, ${WD[parseD(x.date).getDay()]}</div>`; last = x.date; }
    const ic = x.type === 'income' ? '↗' : x.type === 'save' ? '✦' : '↘';
    const cls = x.type === 'income' ? 'inc' : x.type === 'save' ? 'sav' : '';
    h += `<div class="row tap" data-a="txEdit" data-id="${x.id}"><div class="ico">${ic}</div><div class="grow"><div>${esc(x.category)}</div>${x.comment ? `<small>${esc(x.comment)}</small>` : ''}</div>
      <div class="amt ${cls}">${x.type === 'expense' ? '−' : '+'}${rub(x.amount)}</div></div>`;
  }
  return h;
}

    // витамины
    if (s.vitamins.length) {
      h += `<div class="card"><h3>Приём витаминов</h3><div class="scroll"><table class="hg"><tr><th class="nm"></th>${keys.map((k) => `<th class="${k === t ? 't' : ''}">${WD[parseD(k).getDay()]}</th>`).join('')}</tr>

const totals = (list) => {
  const o = { income: 0, expense: 0, save: 0 };
  for (const x of list) o[x.type] = (o[x.type] || 0) + x.amount;
  o.left = o.income - o.expense - o.save;
  return o;
};
function avgIncome(list) {
  const by = {};
  for (const x of list) if (x.type === 'income') by[x.date.slice(0, 7)] = (by[x.date.slice(0, 7)] || 0) + x.amount;
  const ms = Object.keys(by);
  return { months: ms.length, avg: ms.length ? sum(Object.values(by)) / ms.length : 0 };
}
const annuity = (P, rate, n) => { const r = rate / 1200; return n <= 0 ? 0 : r ? (P * r) / (1 - Math.pow(1 + r, -n)) : P / n; };
function debtInfo() {
  const ds = S.settings.debts;
  const total = sum(ds.map((d) => num(d.balance)));
  const rate = total ? Math.round((sum(ds.map((d) => num(d.balance) * num(d.rate))) / total) * 10) / 10 : 0;
  return { total, rate, min: sum(ds.map((d) => num(d.min))), interest: sum(ds.map((d) => (num(d.balance) * num(d.rate)) / 1200)) };
}
function savedFor(goal) {
  return num(goal.start) + sum(S.allTx.filter((x) => x.type === 'save' && x.category === goal.name).map((x) => x.amount));
}

// ================== Бюджет: анализ месяца и прогноз распределения ==================
const ESSENTIAL = /жиль|комму|аренд|ипот|продукт|транспорт|такси|связь|интернет|здоров|аптек|лекар|питом/i;
const DEBT_CAT = /кредит|долг|займ|рассроч/i;
// доля «на жизнь» по умолчанию, если истории расходов ещё нет
const DEFAULT_W = [[/жиль|комму|аренд/i, 30], [/продукт/i, 22], [/транспорт|такси/i, 8], [/кафе|доставк/i, 6], [/здоров|аптек/i, 5],
  [/одежд|обув/i, 5], [/красот|уход/i, 4], [/дом|быт/i, 4], [/развлеч/i, 4], [/связь|интернет/i, 3], [/подар/i, 3],
  [/подписк/i, 2], [/образов/i, 2], [/хобби/i, 2], [/питом/i, 2], [/путешеств/i, 0], [/прочее/i, 3]];
const defaultW = (name) => { for (const [re, w] of DEFAULT_W) if (re.test(name)) return w; return 2; };
const r100 = (n) => Math.floor(n / 100) * 100;

function budgetCalc(m) {
  const s = S.settings, all = S.allTx, t = TODAY();
  const inMonth = all.filter((x) => x.date.startsWith(m));
  const T = totals(inMonth);
  // ---- доход: факт месяца, иначе прогноз по прошлым месяцам или зарплате
  const prevInc = {};
  for (const x of all) if (x.type === 'income' && x.date.slice(0, 7) < m) prevInc[x.date.slice(0, 7)] = (prevInc[x.date.slice(0, 7)] || 0) + x.amount;
  const lastInc = Object.keys(prevInc).sort().slice(-3).map((k) => prevInc[k]);
  const sal = s.salary || {};
  const salNet = num(sal.gross) * (1 - num(sal.tax) / 100);
  let income = T.income, incomeSrc = 'fact';
  if (S.budgetIncome != null && S.budgetIncome > 0) { income = S.budgetIncome; incomeSrc = 'manual'; }
  else if (!income) {
    if (lastInc.length) { income = avg(lastInc); incomeSrc = 'avg'; }
    else if (salNet) { income = salNet; incomeSrc = 'salary'; }
  }
  // ---- 1. долги: платёж по плану (или минимальные, если не хватает)
  const D = debtInfo();
  const paidMap = s.debtPlan.paid || {};
  const paidBefore = sum(Object.entries(paidMap).filter(([k]) => k < m).map(([, v]) => num(v)));
  const left = Math.max(0, D.total - paidBefore);
  let monthsLeft = num(s.debtPlan.months) || 12;
  if (s.debtPlan.firstPay) monthsLeft = Math.max(1, monthsLeft - Math.max(0, monthsBetween(ymOf(s.debtPlan.firstPay) + '-01', m + '-01')));
  let debtPay = left ? annuity(left, D.rate, monthsLeft) : 0;
  let debtNote = left ? `по плану закрытия за ${num(s.debtPlan.months) || 12} мес.` : '';
  if (debtPay > income * 0.5 && D.min) { debtPay = Math.min(debtPay, Math.max(D.min, income * 0.5)); debtNote = 'урезано до половины дохода — минимум по всем долгам ' + rub(D.min); }
  const debtPaid = num(paidMap[m]) + sum(inMonth.filter((x) => x.type === 'expense' && DEBT_CAT.test(x.category)).map((x) => x.amount));
  // ---- 2. накопления: % от дохода, делим между целями по «нужно в месяц»
  const savePool = (income * num(s.savePct)) / 100;
  const gl = s.goals.filter((g) => g.name).map((g) => {
    const saved = savedFor(g), target = num(g.target), rest = Math.max(0, target - saved);
    const ml = g.deadline ? Math.max(1, monthsBetween(m + '-01', g.deadline)) : 12;
    return { g, need: rest ? rest / ml : 0, rest };
  }).filter((x) => x.rest > 0);
  const needSum = sum(gl.map((x) => x.need));
  const goalRows = gl.map((x) => ({ name: x.g.name, dream: x.g.dream, need: x.need, plan: needSum ? (savePool * x.need) / needSum : savePool / gl.length,
    fact: sum(inMonth.filter((t2) => t2.type === 'save' && t2.category === x.g.name).map((t2) => t2.amount)) }));
  const saveFact = T.save;
  // ---- 3. на жизнь: остаток по категориям, опираясь на прошлые месяцы
  const living = Math.max(0, income - debtPay - savePool);
  const histMonths = [...new Set(all.filter((x) => x.type === 'expense' && x.date.slice(0, 7) < m).map((x) => x.date.slice(0, 7)))].sort().slice(-3);
  const hist = {};
  for (const x of all) if (x.type === 'expense' && histMonths.includes(x.date.slice(0, 7)) && !DEBT_CAT.test(x.category)) hist[x.category] = (hist[x.category] || 0) + x.amount;
  const cats = s.categories.filter((c) => c.name && !DEBT_CAT.test(c.name));
  const extraNames = Object.keys(hist).filter((k) => !cats.some((c) => c.name === k));
  let mode = histMonths.length ? 'history' : 'default';
  let rows = cats.map((c) => ({ name: c.name, plan0: num(c.plan), hist: histMonths.length ? (hist[c.name] || 0) / histMonths.length : 0 }))
    .concat(extraNames.map((k) => ({ name: k, plan0: 0, hist: hist[k] / histMonths.length })));
  rows.forEach((r) => { r.ess = ESSENTIAL.test(r.name); r.src = r.plan0 ? 'plan' : mode; });
  const reserveShare = 0.1;
  if (mode === 'default') {
    const fixed = sum(rows.map((r) => r.plan0));
    const pool = Math.max(0, living * (1 - reserveShare) - fixed);
    const wsum = sum(rows.filter((r) => !r.plan0).map((r) => defaultW(r.name)));
    rows.forEach((r) => { r.base = r.plan0 || (wsum ? (pool * defaultW(r.name)) / wsum : 0); });
  } else rows.forEach((r) => { r.base = r.plan0 || r.hist; });
  // подгоняем под доход: сначала режем необязательные, потом обязательные
  const baseSum = sum(rows.map((r) => r.base));
  let short = 0;
  if (baseSum > living) {
    const essSum = sum(rows.filter((r) => r.ess).map((r) => r.base));
    const optSum = baseSum - essSum;
    if (essSum <= living) { const k = optSum ? (living - essSum) / optSum : 0; rows.forEach((r) => { r.budget = r.ess ? r.base : r.base * k; }); }
    else { const k = living / essSum; rows.forEach((r) => { r.budget = r.ess ? r.base * k : 0; }); }
    short = baseSum - living;
  } else rows.forEach((r) => { r.budget = r.base; });
  rows.forEach((r) => { r.budget = r100(r.budget); });
  let free = Math.max(0, living - sum(rows.map((r) => r.budget)));
  if (short > 0 && free > 0) { // при нехватке остаток от округления — в самую крупную категорию
    const tgt = [...rows].sort((a, b) => b.budget - a.budget)[0];
    if (tgt) { tgt.budget += free; free = 0; }
  }
  const catBudget = sum(rows.map((r) => r.budget));
  // ---- факт и темп трат
  const fact = {};
  for (const x of inMonth) if (x.type === 'expense' && !DEBT_CAT.test(x.category)) fact[x.category] = (fact[x.category] || 0) + x.amount;
  rows.forEach((r) => { r.fact = fact[r.name] || 0; });
  for (const k of Object.keys(fact)) if (!rows.some((r) => r.name === k)) rows.push({ name: k, budget: 0, fact: fact[k], base: 0, src: 'new' });
  const n = daysIn(m), cur = ymOf(t) === m, past = m < ymOf(t);
  const dayNo = cur ? parseD(t).getDate() : past ? n : 0;
  const spent = sum(Object.values(fact));
  const pace = dayNo ? (spent / dayNo) * n : 0;
  rows.forEach((r) => { r.proj = cur && dayNo >= 5 ? (r.fact / dayNo) * n : r.fact; });
  // самый дорогой долг — куда направить свободные деньги
  const topDebt = [...s.debts].filter((d) => num(d.balance) > 0).sort((a, b) => num(b.rate) - num(a.rate) || num(a.order) - num(b.order))[0];
  return { m, income, incomeSrc, factIncome: T.income, lastInc, salNet, D, left, debtPay, debtNote, debtPaid, monthsLeft, savePool, goalRows, saveFact,
    living, rows, mode, histMonths, short, free, catBudget, spent, pace, n, dayNo, cur, past, topDebt, T };
}

FIN.salary = () => {
  const s = S.settings, sal = s.salary, D = debtInfo();
  const n1 = num(s.debtPlan.months) || 12, n2 = num(sal.altMonths) || 18;
  const gross = num(sal.gross), tax = (gross * num(sal.tax)) / 100, net = gross - tax, dream = (net * num(sal.dreamPct)) / 100;
  const col = (n) => { const pay = D.total ? annuity(D.total, D.rate, n) : 0; const life = net - pay - dream; return { pay, life }; };
  const A = col(n1), B = col(n2);
  const field = (k, label, type = 'num') => `<label class="fl"><span>${label}</span><input class="in" ${type === 'month' ? 'type="month"' : 'inputmode="decimal"'} value="${esc(type === 'month' ? (sal[k] || '').slice(0, 7) : sal[k] ?? '')}" data-c="sal" data-f="${k}" data-t="${type}"></label>`;
  let h = `<div class="card"><h3>Исходные данные</h3><div class="item form" style="background:none;padding:0">
    ${field('gross', 'Зарплата до налога, ₽')}${field('tax', 'Налог, %')}${field('dreamPct', 'На мечту, % от «чистыми»')}${field('start', 'Первый месяц плана', 'month')}${field('altMonths', 'Второй вариант, мес.')}</div></div>`;
  const tr = (l, a, b, cls = '') => `<tr class="${cls}"><td>${l}</td><td>${a}</td><td>${b}</td></tr>`;
  h += `<div class="card"><h3>Как распределить зарплату</h3><div class="scroll"><table class="tb"><tr><th>Статья</th><th>Кредит ${n1} мес</th><th>Кредит ${n2} мес</th></tr>
    ${tr('↗ Зарплата', rub(gross), rub(gross))}${tr('Налог', rub(tax), rub(tax))}${tr('Чистыми', rub(net), rub(net), 'tot')}
    ${tr('↘ Платёж по кредитам', rub(A.pay), rub(B.pay))}${tr('✦ На мечту', rub(dream), rub(dream))}${tr('◇ На жизнь', rub(A.life), rub(B.life), 'tot')}
    ${tr('На жизнь в день', rub(A.life / 30), rub(B.life / 30))}${tr('Кредит от зарплаты', pc(A.pay, gross) + '%', pc(B.pay, gross) + '%')}${tr('На жизнь от зарплаты', pc(A.life, gross) + '%', pc(B.life, gross) + '%')}</table></div></div>`;
  const g = s.goals.find((x) => x.dream) || s.goals.find((x) => /мечт/i.test(x.name));
  if (g && dream > 0) {
    const target = num(g.target), saved = savedFor(g), startM = sal.start ? ymOf(sal.start) : ymOf(TODAY());
    const calc = (n, pay) => {
      const atEnd = saved + dream * n;
      const after = dream + pay;
      let months;
      if (saved >= target) months = 0;
      else if (atEnd >= target) months = Math.ceil((target - saved) / dream);
      else months = n + Math.ceil((target - atEnd) / after);
      return { atEnd, after, months, date: mmyyyy(addM(startM, months)) };
    };
    const a = calc(n1, A.pay), b = calc(n2, B.pay);
    h += `<div class="card"><h3>Когда сбудется мечта ✨</h3><div class="scroll"><table class="tb"><tr><th></th><th>${n1} мес</th><th>${n2} мес</th></tr>
      ${tr(`Цель «${esc(g.name)}»`, rub(target), rub(target))}${tr('Уже накоплено', rub(saved), rub(saved))}
      ${tr('В месяц, пока платишь кредит', rub(dream), rub(dream))}${tr('В месяц после кредита', rub(a.after), rub(b.after))}
      ${tr('Накопится к концу кредита', rub(a.atEnd), rub(b.atEnd))}${tr('Месяцев до мечты', a.months, b.months)}${tr('✦ Мечта сбудется', a.date, b.date, 'tot')}</table></div>
      <div class="note">Пока закрываешь кредит, на мечту идёт небольшой процент. Как только кредит закрыт — весь его платёж перенаправляется в копилку мечты, поэтому накопления резко ускоряются.</div></div>`;
  }
  return h;
};

const DAYS_ORDER = [1, 2, 3, 4, 5, 6, 0];
function lfield(key, i, it, [name, type, label]) {
  const base = `data-l="${key}" data-n="${i}" data-f="${name}"`;
  if (type === 'check') return `<label class="fl inline full"><button class="chk ${it[name] ? 'on' : ''}" data-a="lchk" ${base}></button><span>${label}</span></label>`;
  if (type === 'days') {
    const d = it[name] || [];
    return `<div class="fl full"><span>${label}</span><div class="days">${DAYS_ORDER.map((w) => `<button class="${d.includes(w) ? 'on' : ''}" data-a="lday" ${base} data-w="${w}">${WD[w]}</button>`).join('')}</div></div>`;
  }
  if (type.startsWith('select:')) {
    const opts = type.slice(7).split(',').map((o) => o.split('='));
    return `<label class="fl"><span>${label}</span><select class="in" data-i="lf" ${base} data-t="select">${opts.map(([v, l]) => `<option value="${v}" ${it[name] === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
  }
  const t = type === 'number' ? 'type="text" inputmode="decimal"' : `type="${type}"`;
  const extra = name === 'name' && LISTS[key].rename ? `data-c="lrename" data-old="${esc(it[name])}"` : '';
  return `<label class="fl"><span>${label}</span><input class="in" ${t} value="${esc(it[name] ?? '')}" data-i="lf" ${extra} ${base} data-t="${type}"></label>`;
}

    if (x.id) await api('PUT', 'tx/' + x.id, body); else await api('POST', 'tx', body);
    closeSheet(); toast(x.id ? 'Сохранено' : 'Записано ✓');
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    reloadQuiet();
  } catch (e) { t.disabled = false; toast(e.message); }
};
A.sDel = async () => {
  const id = S.sheet.id;
  if (!(await ask('Удалить запись?'))) return;
  try { await api('DELETE', 'tx/' + id); closeSheet(); toast('Удалено'); reloadQuiet(); } catch (e) { toast(e.message); }
};
function ask(text) {
  return new Promise((res) => {
    if (tg && tg.showConfirm && tg.initData) { try { tg.showConfirm(text, (ok) => res(!!ok)); return; } catch (e) {} }
    res(window.confirm(text));
  });
}

// списки в настройках
A.sec = (t) => { const k = t.dataset.k; S.open[k] = !S.open[k]; draw(); };
I.lf = (t) => {
  const it = S.settings[t.dataset.l][t.dataset.n];
  it[t.dataset.f] = t.dataset.t === 'number' ? num(t.value) : t.value;
  saveSettings();
};
C.lrename = async (t) => {
  const L = LISTS[t.dataset.l], from = t.dataset.old, to = t.value.trim();
  if (!L.rename || !from || !to || from === to) return;
  t.dataset.old = to;
  try { await api('POST', 'tx-rename', { type: L.rename, from, to }); } catch (e) { toast(e.message); }
};
A.lchk = (t) => { const it = S.settings[t.dataset.l][t.dataset.n]; it[t.dataset.f] = !it[t.dataset.f]; saveSettings(); draw(); };
A.lday = (t) => {
  const it = S.settings[t.dataset.l][t.dataset.n], w = Number(t.dataset.w);
  it.days ||= [];
  const i = it.days.indexOf(w);
  if (i >= 0) it.days.splice(i, 1); else it.days.push(w);
  saveSettings(); draw();
};
A.ladd = (t) => { const k = t.dataset.l; S.settings[k].push({ id: uid(), ...LISTS[k].blank() }); saveSettings(); draw(); const items = document.querySelectorAll(`#sec-${k} ~ .secbody .item`); const last = items[items.length - 1]; if (last) { const i = last.querySelector('input'); if (i) i.focus(); } };
A.lmove = (t) => {
  const arr = S.settings[t.dataset.l], i = Number(t.dataset.n), j = i + Number(t.dataset.d);
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]]; saveSettings(); draw();
};
A.ldel = async (t) => {
  const arr = S.settings[t.dataset.l], i = Number(t.dataset.n);
  if (!(await ask(`Удалить «${arr[i].name || arr[i].type || 'пункт'}»?`))) return;
  arr.splice(i, 1); saveSettings(); draw();
};
I.gen = (t) => {
  const path = t.dataset.p.split('.'); let o = S.settings;
  while (path.length > 1) o = o[path.shift()];
  o[path[0]] = t.dataset.t === 'number' ? num(t.value) : t.value;
  saveSettings();
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]');
  if (t && A[t.dataset.a]) A[t.dataset.a](t, e);
});
document.addEventListener('input', (e) => {
  const t = e.target.closest('[data-i]');
  if (t && I[t.dataset.i]) I[t.dataset.i](t, e);
});
document.addEventListener('change', (e) => {
  const t = e.target.closest('[data-c]');
  if (t && C[t.dataset.c]) C[t.dataset.c](t, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const t = e.target.closest('[data-enter]');
  if (t && A[t.dataset.enter]) { e.preventDefault(); A[t.dataset.enter](t, e); }
});

A.bkCopy = async (t) => {
  t.disabled = true;
  try {
    const text = await exportAll();
    let copied = false;
    try { await navigator.clipboard.writeText(text); copied = true; } catch (e) {}
    if (!copied) { const ta = $('#bkText'); ta.value = text; ta.select(); try { copied = document.execCommand('copy'); } catch (e) {} }
    toast(copied ? 'Копия скопирована — вставьте её в «Избранное»' : 'Выделите текст в поле ниже и скопируйте');
  } catch (e) { toast(e.message); }
  t.disabled = false;
};
A.bkRestore = async (t) => {
  const text = $('#bkText').value;
  if (!text.trim()) return toast('Сначала вставьте текст копии');
  if (!(await ask('Восстановить данные из копии? Текущие настройки и записи за эти месяцы будут заменены.'))) return;
  t.disabled = true;
  try { await importAll(text); toast('Восстановлено ✓'); setTimeout(() => location.reload(), 700); }
  catch (e) { toast(e.message); t.disabled = false; }
};
async function kvInfo() {
  try { const n = (await KV.keys()).length; S.kvInfo = `Занято ${n} из 1024 ячеек хранилища (${Math.round((n / 1024) * 100)}%).`; } catch (e) {}
}

// ---------- первый запуск ----------
function onboarding(err) {
  $('#tabs').hidden = true;
  $('#view').innerHTML = `<div class="head"><h1>Привет${S.me && S.me.name !== 'Демо' ? ', ' + esc(S.me.name) : ''}! 👋</h1></div>
    <p class="hint" style="padding:0 16px">Это ваш личный планер: задачи, привычки, витамины, пульс дня и финансы. Данные хранятся в вашем аккаунте Telegram и видны только вам.</p>
    ${ENC_SEED ? `<div class="card"><h3>Перенести данные из таблиц</h3><p class="hint">Если вам дали код переноса — введите его.</p>
      <input class="in" id="seedCode" placeholder="Код, например ABCD-1234" autocapitalize="characters" data-enter="seedGo" style="text-align:center;font-size:18px;letter-spacing:.08em">
      ${err ? `<p class="bad" style="font-size:13px;margin:8px 0 0">${esc(err)}</p>` : ''}
      <button class="btn wide" data-a="seedGo">Перенести мои данные</button></div>` : ''}
    <div class="card"><h3>Начать с чистого листа</h3><p class="hint">Стандартные категории расходов и поля пульса дня уже будут. Привычки, витамины, цели и долги добавите в Настройках.</p>
      <button class="btn ${ENC_SEED ? 'ghost' : ''} wide" data-a="freshGo">Начать</button></div>`;
}
A.seedGo = async (t) => {
  const code = $('#seedCode').value;
  if (!normCode(code)) return $('#seedCode').focus();
  t.disabled = true; t.textContent = 'Переношу…';
  try {
    const data = await decryptSeed(code);
    await importSeed(data);
    S.settings = normSettings(cl(data.settings));
    toast('Данные перенесены ✓');
    startApp();
  } catch (e) { onboarding(e.message); }
};
A.freshGo = async (t) => {
  t.disabled = true;
  try {
    const st = normSettings(cl(STARTER || { pulse: [], categories: [], sources: [] }));
    await writeQ('s', st);
    S.settings = st;
    startApp();
  } catch (e) { t.disabled = false; toast(e.message); }
};
function startApp() { $('#tabs').hidden = false; S.tab = 'today'; go(); kvInfo(); }

// ================== старт ==================
(async function boot() {
  if (tg && tg.initData && !tg.CloudStorage) {
    $('#view').innerHTML = '<div class="msg"><b>Обновите Telegram</b><span class="sub">Планеру нужна версия Telegram, которая умеет хранить данные мини-приложений.</span></div>';
    return;
  }
  if (tg && tg.initData && tg.isVersionAtLeast && !tg.isVersionAtLeast('6.9')) {
    $('#view').innerHTML = '<div class="msg"><b>Обновите Telegram</b><span class="sub">Нужна версия Telegram посвежее, чтобы сохранять данные.</span></div>';
    return;
  }
  try {
    const me = await api('GET', 'me');
    S.me = me;
    if (!me.settings) return onboarding();
    S.settings = normSettings(me.settings);
  } catch (e) {
    $('#view').innerHTML = `<div class="msg"><b>Не удалось загрузить</b><span class="sub">${esc(e.message)}</span><br><br><button class="btn" onclick="location.reload()">Повторить</button></div>`;
    return;
  }
  startApp();
})();
</script>
</body>
</html>
